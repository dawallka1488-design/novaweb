<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Abstract violet and cyan 3D shapes on a dark navy background</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1236"/>
      <stop offset="1" stop-color="#050818"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C4DFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#7C4DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>

    <radialGradient id="sphere" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#E4DAFF"/>
      <stop offset="0.35" stop-color="#8B5CFF"/>
      <stop offset="1" stop-color="#1B1260"/>
    </radialGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5F3FC" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#1E1B4B" stop-opacity="0.5"/>
    </linearGradient>

    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#9FB0FF" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1600" height="900" fill="url(#fade)"/>
    </mask>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#050818" stop-opacity="0"/>
      <stop offset="1" stop-color="#050818" stop-opacity="0.75"/>
    </radialGradient>

    <clipPath id="frontHalf">
      <rect x="400" y="450" width="800" height="300"/>
    </clipPath>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- Background and lighting -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="620" cy="380" r="520" fill="url(#glowViolet)"/>
  <circle cx="1100" cy="640" r="440" fill="url(#glowCyan)"/>
  <rect width="1600" height="900" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- Distant orbit -->
  <ellipse cx="800" cy="450" rx="620" ry="250" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="4 14" transform="rotate(-24 800 450)"/>

  <!-- Floor glow -->
  <ellipse cx="800" cy="790" rx="360" ry="36" fill="#7C4DFF" fill-opacity="0.35" filter="url(#softBlur)"/>

  <!-- Ring, back half -->
  <g transform="rotate(-24 800 450)">
    <ellipse cx="800" cy="450" rx="330" ry="118" fill="none" stroke="url(#ring)" stroke-width="54"/>
    <ellipse cx="800" cy="436" rx="330" ry="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
    <ellipse cx="800" cy="466" rx="330" ry="118" fill="none" stroke="#1B1260" stroke-opacity="0.35" stroke-width="8"/>
  </g>

  <!-- Sphere -->
  <circle cx="800" cy="450" r="190" fill="#8B5CFF" fill-opacity="0.35" filter="url(#softBlur)"/>
  <circle cx="800" cy="450" r="150" fill="url(#sphere)"/>
  <ellipse cx="750" cy="385" rx="46" ry="28" fill="#FFFFFF" fill-opacity="0.35" transform="rotate(-30 750 385)"/>

  <!-- Ring, front half -->
  <g transform="rotate(-24 800 450)">
    <g clip-path="url(#frontHalf)">
      <ellipse cx="800" cy="450" rx="330" ry="118" fill="none" stroke="url(#ring)" stroke-width="54"/>
      <ellipse cx="800" cy="436" rx="330" ry="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="3"/>
      <ellipse cx="800" cy="466" rx="330" ry="118" fill="none" stroke="#1B1260" stroke-opacity="0.35" stroke-width="8"/>
    </g>
  </g>

  <!-- Glass cube, upper right -->
  <g stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="1045,192 1120,234 1120,330 1045,288" fill="url(#cubeLeft)"/>
    <polygon points="1120,234 1195,192 1195,288 1120,330" fill="url(#cubeRight)"/>
    <polygon points="1120,150 1195,192 1120,234 1045,192" fill="url(#cubeTop)"/>
  </g>
  <path d="M1058 205l50 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>

  <!-- Glass tile, lower left -->
  <g transform="translate(520 610) rotate(-14)">
    <rect x="-90" y="-90" width="180" height="180" rx="34" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="-30" cy="-28" r="26" fill="#22D3EE" fill-opacity="0.85"/>
    <rect x="-58" y="20" width="116" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.5"/>
    <rect x="-58" y="42" width="70" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.3"/>
  </g>

  <!-- Glass pill, lower right -->
  <g transform="translate(1130 650) rotate(18)">
    <rect x="-120" y="-36" width="240" height="72" rx="36" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="-84" cy="0" r="16" fill="#8B5CFF"/>
    <rect x="-52" y="-6" width="120" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>

  <!-- Small spheres -->
  <circle cx="980" cy="140" r="14" fill="#22D3EE"/>
  <circle cx="430" cy="300" r="9" fill="#C084FC"/>
  <circle cx="1240" cy="470" r="20" fill="url(#sphere)"/>
  <circle cx="640" cy="170" r="22" fill="url(#sphere)"/>
  <circle cx="900" cy="770" r="12" fill="#22D3EE" fill-opacity="0.85"/>

  <!-- Sparkles -->
  <path d="M0-16L4-4 16 0 4 4 0 16-4 4-16 0-4-4Z" fill="#FFFFFF" fill-opacity="0.85" transform="translate(700 230)"/>
  <path d="M0-16L4-4 16 0 4 4 0 16-4 4-16 0-4-4Z" fill="#FFFFFF" fill-opacity="0.7" transform="translate(1000 560) scale(0.7)"/>
  <path d="M0-16L4-4 16 0 4 4 0 16-4 4-16 0-4-4Z" fill="#FFFFFF" fill-opacity="0.7" transform="translate(380 470) scale(0.8)"/>

  <!-- Edge vignette -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
